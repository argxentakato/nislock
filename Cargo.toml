[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
authors = ["Unuaviro F. Argxentakato <unuaviro@argxentakato.me>"]
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
nislock-kbd = { path = "crates/nislock-kbd" }
nislock-input = { path = "crates/nislock-input" }
tiny-skia = "0.11"
fontdue = "0.9"
zeroize = { version = "1", features = ["alloc"] }
libc = "0.2"
calloop = "0.13"
smithay-client-toolkit = { version = "0.19", features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
pam = "0.7"

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.nislock-kbd]
opt-level = 3

[profile.release]
lto = "thin"
