[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.1.0"
authors = ["Unuaviro F. Argxentakato <unuaviro@argxentakato.me>"]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/argxentakato/nislock"

[workspace.dependencies]
nislock-kbd = { path = "crates/nislock-kbd" }
nislock-input = { path = "crates/nislock-input" }
zeroize = { version = "1", features = ["alloc"] }
thiserror = "2"

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.nislock-kbd]
opt-level = 3

[profile.release]
lto = "thin"
