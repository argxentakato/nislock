[package]
name = "nislock"
description = "ext-session-lock-v1 locker with a controller-driven on-screen keyboard"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
calloop = { version = "0.13", features = ["signals"] }
nislock-input.workspace = true
nislock-kbd.workspace = true
smithay-client-toolkit = { version = "0.19", features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
zeroize.workspace = true
pam = "0.7"
uzers = "0.12"
thiserror.workspace = true
miette = { version = "7", features = ["fancy"] }
clap = { version = "4.6", features = ["derive", "cargo", "unicode", "wrap_help", "string"] }

[build-dependencies]
clap_mangen = "0.3.3"
