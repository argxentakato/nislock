name: Rust Testing

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Rustfmt & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30

      - uses: Swatinem/rust-cache@v2

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Run rustfmt
        run: nix develop -c cargo fmt --all -- --check

      - name: Run clippy
        run: nix develop -c cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: nix develop -c cargo build --workspace --locked --verbose

      - name: Run tests
        run: nix develop -c cargo test --workspace --locked --verbose

  package:
    name: Nix package
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30

      - name: Check flake
        run: nix flake check --no-build

      - name: Build nislock package
        run: nix build --print-build-logs .#default
